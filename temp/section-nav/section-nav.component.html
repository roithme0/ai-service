<nav [attr.aria-label]="label()">
  <div class="track">
    @for (item of items(); track item.id) {
      <button
        type="button"
        [class.active]="activeId() === item.id"
        [attr.aria-current]="activeId() === item.id ? 'location' : null"
        (click)="selected.emit(item.id)"
      >
        {{ item.label }}
      </button>
    }
  </div>
</nav>
