name: ai-service-local

services:
  backend:
    build:
      context: ../backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend

  gateway:
    image: nginx:1.25
    ports:
      - "${FRONTEND_PORT:-8000}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
