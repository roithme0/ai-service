name: ai-service-local

services:
  backend:
    build:
      context: ../backend
    environment:
      KOCHWIKI_BASE_URL: "${KOCHWIKI_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      RECIPE_IMPROVEMENT_OPENAI_MODEL: "${RECIPE_IMPROVEMENT_OPENAI_MODEL:-}"

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend

  gateway:
    image: nginx:1.25
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
