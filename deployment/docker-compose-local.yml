name: ai-service-local

services:
  backend:
    extends:
      file: docker-compose-common.yml
      service: backend
    build:
      context: ../backend
    volumes:
      - image-generation:/var/lib/ai-service/image-generation

  frontend:
    extends:
      file: docker-compose-common.yml
      service: frontend
    build:
      context: ../frontend

  gateway:
    extends:
      file: docker-compose-common.yml
      service: gateway

volumes:
  image-generation:
