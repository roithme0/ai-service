name: ai-service-production

services:
  backend:
    image: roithme0/ai-service-backend:latest
    restart: unless-stopped
    environment:
      KOCHWIKI_MCP_URL: "${KOCHWIKI_MCP_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      KOCHWIKI_OPENAI_MODEL: "${KOCHWIKI_OPENAI_MODEL:-}"
      KOCHWIKI_OPENAI_REASONING_EFFORT: "${KOCHWIKI_OPENAI_REASONING_EFFORT:-}"

  frontend:
    image: roithme0/ai-service-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  gateway:
    image: nginx:1.25
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
