name: ai-service-production

services:
  backend:
    image: roithme0/ai-service-backend:latest
    restart: unless-stopped

  frontend:
    image: roithme0/ai-service-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  gateway:
    image: nginx:1.25
    ports:
      - "${FRONTEND_PORT:-8000}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
