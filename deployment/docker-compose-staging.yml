name: ai-service-staging

services:
  backend:
    extends:
      file: docker-compose-common.yml
      service: backend
    image: roithme0/ai-service-backend:alpha
    restart: unless-stopped
    volumes:
      - ./backend/image-generation:/var/lib/ai-service/image-generation

  frontend:
    extends:
      file: docker-compose-common.yml
      service: frontend
    image: roithme0/ai-service-frontend:alpha
    restart: unless-stopped

  gateway:
    extends:
      file: docker-compose-common.yml
      service: gateway
