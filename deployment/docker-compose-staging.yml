name: ai-service-staging

services:
  backend:
    image: roithme0/ai-service-backend:alpha
    restart: unless-stopped
    environment:
      KOCHWIKI_MCP_URL: "${KOCHWIKI_MCP_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      KOCHWIKI_OPENAI_MODEL: "${KOCHWIKI_OPENAI_MODEL:-}"

  frontend:
    image: roithme0/ai-service-frontend:alpha
    restart: unless-stopped
    depends_on:
      - backend

  gateway:
    image: nginx:1.25
    ports:
      - "${GATEWAY_PORT:-8001}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
