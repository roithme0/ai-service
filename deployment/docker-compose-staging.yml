name: ai-service-staging

services:
  backend:
    image: "${AI_SERVICE_BACKEND_IMAGE:?Set AI_SERVICE_BACKEND_IMAGE}"
    restart: unless-stopped

  frontend:
    image: "${AI_SERVICE_FRONTEND_IMAGE:?Set AI_SERVICE_FRONTEND_IMAGE}"
    restart: unless-stopped
    depends_on:
      - backend

  gateway:
    image: nginx:1.25
    ports:
      - "${FRONTEND_PORT:-8001}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
