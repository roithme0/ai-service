name: ai-service-gateway-timeout-test

services:
  backend:
    image: python:3.12-alpine
    command: ["python", "/tests/test_timeout.py", "serve"]
    volumes:
      - .:/tests:ro
    networks:
      default:
        aliases: [frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 1s
      timeout: 2s
      retries: 20

  gateway:
    image: nginx:1.25
    volumes:
      - ../../nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  gateway-tests:
    image: python:3.12-alpine
    command: ["python", "/tests/test_timeout.py"]
    volumes:
      - .:/tests:ro
    depends_on:
      - gateway
