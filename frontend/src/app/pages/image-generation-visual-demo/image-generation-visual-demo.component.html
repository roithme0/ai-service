<app-demo-header label="Image Generation Visual Demo" tag="Scripted" />
<main class="page">
  <section class="controls" aria-label="Demo controls">
    <app-section-nav
      label="Scenario"
      [items]="scenarios"
      [activeId]="scenario()"
      (selected)="selectScenario($event)"
    />
    <div class="actions">
      <mat-form-field>
        <mat-label>Primary action outcome</mat-label>
        <mat-select [value]="outcome()" (selectionChange)="outcome.set($event.value)">
          <mat-option value="success">Success</mat-option>
          <mat-option value="failure">Failure</mat-option>
        </mat-select>
      </mat-form-field>
      <button matButton="filled" type="button" (click)="reset()">Reset</button>
    </div>
    <p>Scripted demo. Results use a predefined image.</p>
    <p>Instructions do not change the predefined result.</p>
  </section>
  <div class="showcase">
    @for (run of runs(); track run.id) {
      <app-image-generation-visual-run [scenario]="scenario()" [outcome]="outcome()" />
    }
  </div>
</main>
