<app-demo-header label="Image Generation Visual Demo" tag="Scripted" />
<main class="page">
  <section class="controls" aria-label="Demo controls">
    <app-section-nav
      label="Scenario"
      [items]="scenarios"
      [activeId]="scenario()"
      (selected)="selectScenario($event)"
    />
    <div class="actions">
      <span id="outcome-label">Primary action outcome</span>
      <mat-radio-group
        aria-labelledby="outcome-label"
        [value]="outcome()"
        (change)="outcome.set($event.value)"
      >
        <mat-radio-button value="success">Success</mat-radio-button>
        <mat-radio-button value="failure">Failure</mat-radio-button>
      </mat-radio-group>
    </div>
  </section>
  <div class="showcase">
    @for (run of runs(); track run.id) {
      <app-image-generation-visual-run [scenario]="scenario()" [outcome]="outcome()" />
    }
  </div>
</main>
