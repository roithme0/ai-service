<main class="chat-shell">
  <ai-chat-ui
    bannerTitle="Rezept gemeinsam verbessern"
    bannerDescription="Beschreibe, was du an deinem Rezept ändern möchtest. Ich helfe dir dabei, passende Möglichkeiten und ihre Vor- und Nachteile zu erkunden."
    composerPlaceholder="Nachricht schreiben"
    [content]="chat().content"
    [composerDisabled]="chat().composerDisabled"
    [conversationStatus]="chat().status"
    (messageSubmitted)="handleMessage($event)"
    (statusActionTriggered)="handleStatusAction($event)"
  />
</main>
