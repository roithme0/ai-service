<section class="chat-ui" aria-label="Chat conversation">
  <div class="history" role="log" aria-live="polite">
    <section class="banner">
      <h2>{{ bannerTitle() }}</h2>
      <p>{{ bannerDescription() }}</p>
    </section>

    <div class="messages">
      @for (message of messages(); track message.id) {
        @if (message.role === 'user') {
          <article class="message message--user" aria-label="User message">
            <p>{{ message.text }}</p>
          </article>
        } @else {
          <article
            class="message message--assistant markdown"
            aria-label="Assistant message"
            [innerHTML]="renderAssistantMarkdown(message.text)"
          ></article>
        }
      }
    </div>
  </div>

  <form class="composer" (submit)="submit($event)">
    <div class="composer-input">
      <textarea
        #composer
        cdkTextareaAutosize
        cdkAutosizeMinRows="1"
        cdkAutosizeMaxRows="5"
        placeholder="Write a message"
        aria-label="Message"
        enterkeyhint="send"
        [value]="draft()"
        (input)="updateDraft(composer.value)"
        (keydown)="submitFromKeyboard($event)"
      ></textarea>
    </div>
    <button
      class="send-button"
      matIconButton
      type="submit"
      aria-label="Send message"
      [disabled]="draft().trim() === ''"
    >
      <mat-icon svgIcon="ai-chat:send" aria-hidden="true" />
    </button>
  </form>
</section>
