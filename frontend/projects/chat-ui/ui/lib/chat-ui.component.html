<section class="chat-ui" aria-label="Chat-Unterhaltung">
  <div class="history" role="log" aria-live="polite">
    <section class="banner">
      <h2>{{ bannerTitle() }}</h2>
      <p>{{ bannerDescription() }}</p>
    </section>

    <div class="messages">
      @for (item of content(); track item.id) {
        @if (item.kind === 'artifact') {
          <ai-chat-artifact-card [artifact]="item" [renderer]="rendererFor(item.type)" />
        } @else if (item.role === 'user') {
          <article class="message message--user" aria-label="Nachricht des Benutzers">
            <p>{{ item.text }}</p>
          </article>
        } @else {
          <article
            class="message message--assistant markdown"
            aria-label="Antwort des Assistenten"
            [innerHTML]="renderAssistantMarkdown(item.text)"
          ></article>
        }
      }

      @if (conversationStatus(); as status) {
        <article
          class="status"
          [class.status--error]="status.kind === 'error'"
          [class.status--assistant]="status.placement === 'assistant'"
        >
          <p>{{ status.message }}</p>
          @if (status.action; as action) {
            <button
              type="button"
              class="status-action"
              (click)="statusActionTriggered.emit(action.id)"
            >
              {{ action.label }}
            </button>
          }
        </article>
      }
    </div>
  </div>

  <form class="composer" (submit)="submit($event)">
    <div class="composer-surface">
      <textarea
        #composer
        cdkTextareaAutosize
        cdkAutosizeMinRows="1"
        cdkAutosizeMaxRows="5"
        [placeholder]="composerPlaceholder()"
        aria-label="Nachricht"
        enterkeyhint="send"
        [value]="draft()"
        [disabled]="composerDisabled()"
        (input)="updateDraft(composer.value)"
        (keydown)="submitFromKeyboard($event)"
      ></textarea>
      <div class="composer-actions">
        <button
          class="send-button"
          matIconButton
          type="submit"
          aria-label="Nachricht senden"
          [disabled]="composerDisabled() || draft().trim() === ''"
        >
          <mat-icon svgIcon="ai-chat:send" aria-hidden="true" />
        </button>
      </div>
    </div>
  </form>
</section>
