<svg xmlns="http://www.w3.org/2000/svg" width="36" height="24" viewBox="0 0 36 24" aria-hidden="true">
  <style>
    .dot {
      fill: currentColor;
      animation: loading-pulse 1.3s ease-in-out infinite;
    }
    .dot:nth-of-type(2) { animation-delay: .16s; }
    .dot:nth-of-type(3) { animation-delay: .32s; }
    @keyframes loading-pulse {
      0%, 60%, 100% { opacity: .35; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }
  </style>
  <circle class="dot" cx="6" cy="13" r="3.5"/>
  <circle class="dot" cx="18" cy="13" r="3.5"/>
  <circle class="dot" cx="30" cy="13" r="3.5"/>
</svg>
