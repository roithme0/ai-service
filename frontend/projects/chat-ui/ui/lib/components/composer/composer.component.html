<form (submit)="submit($event)">
  <div class="surface">
    <img class="mascot" [src]="mascotSource()" alt="" aria-hidden="true" draggable="false" />
    <textarea
      #composer
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="5"
      [placeholder]="placeholder()"
      aria-label="Nachricht"
      enterkeyhint="send"
      [value]="draft()"
      [attr.aria-disabled]="editingDisabled() ? 'true' : null"
      (beforeinput)="preventBlockedEdit($event)"
      (input)="updateDraft(composer)"
      (keydown)="submitFromKeyboard($event)"
      (focus)="onFocus(composer)"
      (blur)="stopObservingViewport()"
    ></textarea>
    <div class="actions">
      <button
        class="send-button"
        matIconButton
        type="submit"
        aria-label="Nachricht senden"
        [disabled]="disabled() || editingDisabled() || draft().trim() === ''"
        (pointerdown)="preserveComposerFocus($event, composer)"
        (mousedown)="preserveComposerFocus($event, composer)"
      >
        <mat-icon svgIcon="ai-chat:send" aria-hidden="true" />
      </button>
    </div>
  </div>
</form>
