@if (usage(); as usage) {
  <div class="usage-panel" [class.expanded]="usageExpanded()" [inert]="!usageExpanded()">
    <ai-chat-usage-panel [usage]="usage" (collapsed)="setUsageExpanded(false, $event)" />
  </div>
}
<form (submit)="submit($event)">
  <div class="surface">
    <img
      class="mascot"
      [class.faded]="usageExpanded()"
      [src]="mascotSource()"
      alt=""
      aria-hidden="true"
      draggable="false"
    />
    <textarea
      #composer
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="5"
      [placeholder]="placeholder()"
      aria-label="Nachricht"
      enterkeyhint="send"
      [value]="draft()"
      [attr.aria-disabled]="editingDisabled() ? 'true' : null"
      (beforeinput)="preventBlockedEdit($event)"
      (input)="updateDraft(composer)"
      (keydown)="submitFromKeyboard($event)"
      (focus)="onFocus(composer)"
      (blur)="stopObservingViewport()"
    ></textarea>
    <div class="actions">
      <button
        aiChatPreventPointerFocus
        class="send-button"
        matIconButton
        type="submit"
        aria-label="Nachricht senden"
        [disabled]="disabled() || editingDisabled() || draft().trim() === ''"
      >
        <mat-icon svgIcon="ai-chat:send" aria-hidden="true" />
      </button>
    </div>
  </div>
</form>
@if (usage(); as usage) {
  <div class="usage-line" [class.faded]="usageExpanded()" [inert]="usageExpanded()">
    <button
      #usageToggle
      aiChatPreventPointerFocus
      class="usage-toggle"
      type="button"
      aria-label="Chat-Verbrauch anzeigen"
      [attr.aria-expanded]="usageExpanded()"
      (click)="setUsageExpanded(true, $event)"
    >
      <ai-chat-usage-line [usage]="usage" />
      <mat-icon svgIcon="ai-chat:arrow-up" aria-hidden="true" />
    </button>
  </div>
}
