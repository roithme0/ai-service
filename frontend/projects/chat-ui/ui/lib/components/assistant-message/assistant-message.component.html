<article aria-label="Antwort des Assistenten">
  <div class="markdown" [innerHTML]="renderAssistantMarkdown(message().text)"></div>
  @if (showDetailsToggle()) {
    <div class="answer-actions">
      <button
        #detailsToggle
        type="button"
        class="details-toggle"
        [attr.aria-expanded]="detailsExpanded()"
        [attr.aria-label]="detailsExpanded() ? 'Details ausblenden' : 'Details anzeigen'"
        [title]="detailsExpanded() ? 'Details ausblenden' : 'Details anzeigen'"
        (click)="detailsToggled.emit(detailsToggle)"
      >
        <mat-icon svgIcon="ai-chat:list-tree" aria-hidden="true" />
      </button>
    </div>
  }
</article>
