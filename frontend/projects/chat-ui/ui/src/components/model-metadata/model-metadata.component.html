<span class="name" [title]="model().name">
  <span class="visually-hidden">Modell: </span>{{ model().name }}
</span>
<span class="separator" aria-hidden="true">&middot;</span>
<span class="effort" [title]="model().reasoningEffort ?? 'nicht festgelegt'">
  <span class="visually-hidden">Reasoning: </span
  >{{ model().reasoningEffort ?? 'nicht festgelegt' }}
</span>
