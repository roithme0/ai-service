@let status = this.status();
@if (visible()) {
  @for (label of [status]; track label.message) {
    <div
      class="content"
      [class.fade]="status.kind === 'loading' && status.placement === 'conversation'"
    >
      @if (status.kind === 'loading' && status.placement === 'assistant') {
        <ai-chat-loading-dots class="loading-dots" [label]="status.message" />
      } @else {
        <p>{{ status.message }}</p>
      }
      @if (status.action; as action) {
        <button type="button" class="action" (click)="actionTriggered.emit(action.id)">
          {{ action.label }}
        </button>
      }
    </div>
  }
}
