<h2 #heading tabindex="-1">Bild erstellen</h2>
<div class="surface">
  <textarea
    cdkTextareaAutosize
    cdkAutosizeMinRows="3"
    cdkAutosizeMaxRows="10"
    #textarea
    [id]="inputId"
    aria-label="Beschreibung"
    required
    [value]="draft()"
    (input)="draftChange.emit(textarea.value)"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="error() ? errorId : null"
    placeholder="Beschreiben Sie das Bild, das Sie erstellen möchten"
  ></textarea>
</div>
@if (error()) {
  <p [id]="errorId" class="error" role="alert">{{ error() }}</p>
}
<div class="actions">
  @if (canGoBack()) {
    <button mat-button type="button" (click)="back.emit()">Zurück zum Ergebnis</button>
  }
  <button
    mat-flat-button
    type="button"
    [disabled]="pending() || !draft().trim()"
    (click)="generate.emit()"
  >
    Bild erstellen
  </button>
</div>
