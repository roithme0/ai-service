<section class="layout">
  @switch (panel()) {
    @case ('input') {
      <ai-image-generation-input-panel
        [draft]="draft()"
        [error]="error()"
        [pending]="pending()"
        [canGoBack]="state().snapshot?.status === 'completed' && !failure()"
        (draftChange)="draft.set($event)"
        (generate)="submit()"
        (back)="back()"
      />
    }
    @case ('generating') {
      <ai-image-generation-generating-panel
        [admission]="state().admission"
        [editable]="effectiveMode() === 'editable'"
        [observation]="state().observation"
        [error]="error()"
        [pending]="pending()"
        (retry)="retry()"
        (edit)="editFailure()"
        (recover)="
          invoke(actions().recoverSubmission, 'Die Anfrage konnte nicht wiederhergestellt werden.')
        "
        (reconnect)="
          invoke(
            actions().reconnect,
            'Die Verbindung zum Status konnte nicht wiederhergestellt werden.'
          )
        "
      />
    }
    @case ('outcome') {
      <ai-image-generation-outcome-panel
        [image]="result()"
        [editable]="effectiveMode() === 'editable'"
        [snapshot]="state().snapshot"
        [failure]="failure()"
        [error]="error()"
        [contentError]="contentError()"
        [loading]="loading()"
        [pending]="pending()"
        [primaryLabel]="primaryAction()?.label ?? null"
        (refine)="failure() ? editFailure() : refine()"
        (retry)="retry()"
        (download)="download()"
        (handoff)="handoff()"
        (retryImage)="retryImage()"
        (imageError)="imageError()"
      />
    }
  }
</section>
