[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service-backend"
version = "0.1.0"
description = "Backend for the AI Service."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]==0.141.1",
    "openai>=2,<3",
    "pydantic==2.13.5",
    "pydantic-settings>=2,<3",
    "kochwiki-contract @ https://github.com/roithme0/kochwiki-v2/releases/download/v0.1.0-alpha/kochwiki_contract-0.1.0a0-py3-none-any.whl#sha256=8028ad6912426a08991630fb827928ecaa8cad579775baab581caa103a8cfbed",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
