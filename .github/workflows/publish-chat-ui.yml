name: Build and publish chat UI package

on:
  pull_request:
  push:
    tags:
      - 'chat-ui-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend contract dependencies
        run: python -m pip install -e ../backend

      - name: Validate release tag
        if: github.event_name == 'push'
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const match = /^chat-ui-v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(-alpha(?:\.(?:0|[1-9]\d*))?)?)$/.exec(process.env.RELEASE_TAG ?? '');
          if (!match) {
            throw new Error('Expected chat-ui-v1.2.0, chat-ui-v1.2.0-alpha, or chat-ui-v1.2.0-alpha.123 (no leading zeros).');
          }
          const channel = match[2] ? 'alpha' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\nchannel=${channel}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Check generated conversation contract
        run: npm run check:conversation-contract

      - name: Build library
        run: npm run build:chat-ui

      - name: Upload built library
        uses: actions/upload-artifact@v4
        with:
          name: chat-ui-package
          path: frontend/dist/chat-ui/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/chat-ui-v')
    runs-on: ubuntu-latest
    env:
      CHAT_UI_VERSION: ${{ needs.build.outputs.version }}
      CHAT_UI_CHANNEL: ${{ needs.build.outputs.channel }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@roithme0'

      - name: Download built library
        uses: actions/download-artifact@v4
        with:
          name: chat-ui-package
          path: frontend/dist/chat-ui/

      - name: Set published package version
        run: npm version "$CHAT_UI_VERSION" --prefix dist/chat-ui --no-git-tag-version --allow-same-version

      - name: Publish library
        run: npm publish ./dist/chat-ui --tag "$CHAT_UI_CHANNEL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
