name: Build and publish chat UI package

on:
  pull_request:
  push:
    tags:
      - 'chat-ui-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:chat-ui

      - name: Upload built library
        uses: actions/upload-artifact@v4
        with:
          name: chat-ui-package
          path: frontend/dist/chat-ui/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/chat-ui-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@roithme0'

      - name: Download built library
        uses: actions/download-artifact@v4
        with:
          name: chat-ui-package
          path: frontend/dist/chat-ui/

      - name: Validate release tag
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const match = /^chat-ui-v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/.exec(process.env.GITHUB_REF_NAME ?? '');
          if (!match) {
            throw new Error('Expected a release tag such as chat-ui-v0.0.2');
          }
          appendFileSync(process.env.GITHUB_ENV, `CHAT_UI_VERSION=${match[1]}\n`);
          NODE

      - name: Set published package version
        run: npm version "$CHAT_UI_VERSION" --prefix dist/chat-ui --no-git-tag-version --allow-same-version

      - name: Publish library
        run: npm publish ./dist/chat-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
