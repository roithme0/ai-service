name: Build and publish app and chat UI

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[test,dev]"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate all non-E2E groups
        working-directory: .
        run: node .agents/validation/run.mts --no-format

      - name: Upload browser component diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chat-ui-browser-diagnostics
          path: frontend/projects/chat-ui/test-results/
          include-hidden-files: true
          retention-days: 7

  build-app:
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            image: roithme0/ai-service-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: ''
          - name: frontend
            image: roithme0/ai-service-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        if: github.event_name == 'push'
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const match = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(-alpha(?:\.(?:0|[1-9]\d*))?)?)$/.exec(process.env.RELEASE_TAG ?? '');
          if (!match) {
            throw new Error('Expected v1.2.0, v1.2.0-alpha, or v1.2.0-alpha.123 (no leading zeros).');
          }
          const channel = match[2] ? 'alpha' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\nchannel=${channel}\n`);
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.release.outputs.channel }},enable=${{ github.event_name == 'push' }}

      - name: Build and export image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          outputs: type=oci,dest=${{ runner.temp }}/app-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Upload built image
        uses: actions/upload-artifact@v7
        with:
          name: app-image-${{ matrix.name }}
          path: ${{ runner.temp }}/app-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: build-app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Download built images
        uses: actions/download-artifact@v8
        with:
          pattern: app-image-*
          path: ${{ runner.temp }}/app-images

      - name: Load built images into Docker
        env:
          IMAGE_DIRECTORY: ${{ runner.temp }}/app-images
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          for name in backend frontend; do
            archive="$IMAGE_DIRECTORY/app-image-$name/app-image.tar"
            reference=$(tar -xOf "$archive" index.json | jq -er '.manifests[0].annotations["org.opencontainers.image.ref.name"]')
            skopeo copy "oci-archive:$archive:$reference" "docker-daemon:ai-service-$name:e2e"
          done

      - name: Run Docker-based end-to-end tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIVE_DEMO_OPENAI_MODEL: ${{ vars.LIVE_DEMO_OPENAI_MODEL || 'gpt-6-luna' }}
          LIVE_DEMO_OPENAI_REASONING_EFFORT: ${{ vars.LIVE_DEMO_OPENAI_REASONING_EFFORT || 'medium' }}
        run: node .agents/validation/run.mts --no-format --group e2e --prebuilt-images --ci-prerequisite-contracts

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p .codex-validation/e2e/manual
          docker compose -f deployment/docker-compose-local.yml -f deployment/docker-compose-e2e.override.yml logs --no-color > .codex-validation/e2e/manual/containers.log 2>&1

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            .codex-validation/e2e/manual/*.log
            .codex-validation/e2e/manual/playwright-*/test-results/**
            .codex-validation/e2e/manual/playwright-*/html-report/**
          include-hidden-files: true
          retention-days: 7

  publish-app:
    needs: [build-app, build-chat-ui, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            image: roithme0/ai-service-backend
          - name: frontend
            image: roithme0/ai-service-frontend
    env:
      APP_IMAGE: ${{ matrix.image }}
      RELEASE_VERSION: ${{ needs.build-chat-ui.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.build-chat-ui.outputs.channel }}
    steps:
      - name: Download built image
        uses: actions/download-artifact@v8
        with:
          name: app-image-${{ matrix.name }}
          path: ${{ runner.temp }}

      - name: Install registry client
        uses: regclient/actions/regctl-installer@v0.1.0
        with:
          release: v0.9.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish built image
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/app-image.tar
        run: |
          regctl image import "$APP_IMAGE:$RELEASE_VERSION" "$IMAGE_ARCHIVE"
          regctl image copy "$APP_IMAGE:$RELEASE_VERSION" "$APP_IMAGE:$RELEASE_CHANNEL"

  build-chat-ui:
    needs: e2e
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate release tag
        if: github.event_name == 'push'
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const match = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(-alpha(?:\.(?:0|[1-9]\d*))?)?)$/.exec(process.env.RELEASE_TAG ?? '');
          if (!match) {
            throw new Error('Expected v1.2.0, v1.2.0-alpha, or v1.2.0-alpha.123 (no leading zeros).');
          }
          const channel = match[2] ? 'alpha' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\nchannel=${channel}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:chat-ui

      - name: Upload built library
        uses: actions/upload-artifact@v7
        with:
          name: chat-ui-package
          path: frontend/dist/chat-ui/
          if-no-files-found: error

  publish-chat-ui:
    needs: [build-app, build-chat-ui, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      CHAT_UI_VERSION: ${{ needs.build-chat-ui.outputs.version }}
      CHAT_UI_CHANNEL: ${{ needs.build-chat-ui.outputs.channel }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@roithme0'

      - name: Download built library
        uses: actions/download-artifact@v8
        with:
          name: chat-ui-package
          path: frontend/dist/chat-ui/

      - name: Set published package version
        run: npm version "$CHAT_UI_VERSION" --prefix dist/chat-ui --no-git-tag-version --allow-same-version

      - name: Publish library
        run: npm publish ./dist/chat-ui --tag "$CHAT_UI_CHANNEL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
