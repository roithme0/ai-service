name: Build and publish app and chat UI

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  check-conversation-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: python -m pip install -e "../backend[test]"

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Install frontend dependencies
        run: npm ci

      - name: Check generated conversation contract
        run: npm run check:conversation-contract

  build-app:
    needs: check-conversation-contract
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            image: roithme0/ai-service-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: ''
          - name: frontend
            image: roithme0/ai-service-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        if: github.event_name == 'push'
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const match = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(-alpha(?:\.(?:0|[1-9]\d*))?)?)$/.exec(process.env.RELEASE_TAG ?? '');
          if (!match) {
            throw new Error('Expected v1.2.0, v1.2.0-alpha, or v1.2.0-alpha.123 (no leading zeros).');
          }
          const channel = match[2] ? 'alpha' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\nchannel=${channel}\n`);
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.release.outputs.channel }},enable=${{ github.event_name == 'push' }}

      - name: Build and export image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          outputs: type=oci,dest=${{ runner.temp }}/app-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Upload built image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: app-image-${{ matrix.name }}
          path: ${{ runner.temp }}/app-image.tar
          compression-level: 0
          if-no-files-found: error

  publish-app:
    needs: [build-app, build-chat-ui]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            image: roithme0/ai-service-backend
          - name: frontend
            image: roithme0/ai-service-frontend
    env:
      APP_IMAGE: ${{ matrix.image }}
      RELEASE_VERSION: ${{ needs.build-chat-ui.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.build-chat-ui.outputs.channel }}
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: app-image-${{ matrix.name }}
          path: ${{ runner.temp }}

      - name: Install registry client
        uses: regclient/actions/regctl-installer@v0.1.0
        with:
          release: v0.9.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish built image
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/app-image.tar
        run: |
          regctl image import "$APP_IMAGE:$RELEASE_VERSION" "$IMAGE_ARCHIVE"
          regctl image copy "$APP_IMAGE:$RELEASE_VERSION" "$APP_IMAGE:$RELEASE_CHANNEL"

  build-chat-ui:
    needs: check-conversation-contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install backend contract dependencies
        run: python -m pip install -e ../backend

      - name: Validate release tag
        if: github.event_name == 'push'
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const match = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(-alpha(?:\.(?:0|[1-9]\d*))?)?)$/.exec(process.env.RELEASE_TAG ?? '');
          if (!match) {
            throw new Error('Expected v1.2.0, v1.2.0-alpha, or v1.2.0-alpha.123 (no leading zeros).');
          }
          const channel = match[2] ? 'alpha' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\nchannel=${channel}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Check generated conversation contract
        run: npm run check:conversation-contract

      - name: Build library
        run: npm run build:chat-ui

      - name: Upload built library
        uses: actions/upload-artifact@v7
        with:
          name: chat-ui-package
          path: frontend/dist/chat-ui/
          if-no-files-found: error

  publish-chat-ui:
    needs: [build-app, build-chat-ui]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      CHAT_UI_VERSION: ${{ needs.build-chat-ui.outputs.version }}
      CHAT_UI_CHANNEL: ${{ needs.build-chat-ui.outputs.channel }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@roithme0'

      - name: Download built library
        uses: actions/download-artifact@v4
        with:
          name: chat-ui-package
          path: frontend/dist/chat-ui/

      - name: Set published package version
        run: npm version "$CHAT_UI_VERSION" --prefix dist/chat-ui --no-git-tag-version --allow-same-version

      - name: Publish library
        run: npm publish ./dist/chat-ui --tag "$CHAT_UI_CHANNEL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
